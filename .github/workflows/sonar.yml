name: SonarCloud

# Coverage + static analysis, deliberately separate from ci.yml: ci.yml is the pre-merge gate, and a
# Sonar outage or an expired token must not be able to block a merge.
#
# This REPLACES SonarCloud's automatic analysis. That mode never builds the project and never runs
# the tests, so per its documented limitations "Code coverage information is not supported" — which
# is why the coverage metric was missing entirely. Automatic analysis therefore has to be turned OFF
# (SonarCloud -> Project -> Administration -> Analysis Method), otherwise this scan is rejected.
#
# Scope note: the scanner for .NET only sees projects that are built between `begin` and `end`. As in
# ci.yml the Uno app (Source/Trackify, five heads) is not buildable on a Linux runner, so the
# analysed scope here is the shared core + CLI + tests.
#
# Scope exclusions (`begin` below):
#  - docs/** is the vendored lego-ble-wireless-protocol-docs submodule — third-party HTML/JS we don't
#    own and won't fix; it accounted for 51 of 61 "bugs" and most of the ncloc. (It now also covers
#    docs/arc42/, which is harmless — Sonar has no markdown analyser.)
#  - Source/Trackify/**/*.cs is the Uno app, which per the scope note above is never built here and
#    therefore never analysed. Without the exclusion its files stay INDEXED, so 77 findings left over
#    from the old automatic-analysis mode were frozen OPEN: nothing re-evaluates them, so neither a
#    fix nor a false positive can ever close them. 60 of those 77 were false positives caused by
#    analysis without a compilation — S2325 "make it static" on [ObservableProperty]-generated
#    property reads and on IValueConverter members, and S8970 "nullable warnings are disabled here"
#    when Directory.Build.props sets <Nullable>enable</Nullable>. Only the .cs is excluded, so the
#    WasmScripts JS and any XML still get analysed. Drop this exclusion if the Uno heads are ever
#    built inside begin/end (that needs a windows runner) — then the analysis becomes real.
#
# There is deliberately NO issue-exclusion here. A `sonar.issue.ignore.multicriteria` for docker:S6471
# used to be passed as a /d: parameter and silently did nothing: issue exclusions are multi-value
# SERVER-side settings, so they only apply when set in the SonarCloud UI (Project -> Administration ->
# Analysis Scope), not from the scanner command line. The analysis of 9299be9 ran with that parameter
# in place and still reported the issue as OPEN. The Dockerfile now runs as non-root instead, which
# fixes the finding at the source — prefer that over reaching for an exclusion.
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  sonar:
    name: Scan + coverage
    runs-on: ubuntu-latest
    # Forks never receive SONAR_TOKEN; skip instead of failing their PR with an auth error.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs the full history to attribute issues and resolve the new-code period.
          fetch-depth: 0

      # No JDK step: `begin` runs a Roslyn analyzer inside MSBuild (pure .NET), and the Java-based
      # engine that `end` uses to aggregate and upload provisions its own JRE — "from version 7.0,
      # Java is no longer required because the scanner will download it automatically".

      # Same as ci.yml: global.json pins 9.0.100 and rolls forward to the newest installed major.
      - name: Setup .NET (8, 9, 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install Sonar scanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"Ktechen_Trackify"
          /o:"trackify1"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/coverage/coverage.opencover.xml"
          /d:sonar.exclusions="docs/**,Source/Trackify/**/*.cs"

      # A single step builds everything the scanner should see (the test project references the core
      # libs and the CLI) and lets coverlet instrument that same build — no `--no-build`, otherwise
      # nothing is instrumented. OpenCover is the report format Sonar's C# analyser consumes.
      - name: Test + coverage
        run: >
          dotnet test Test/Trackify.Tests/Trackify.Tests.csproj -c Release
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=opencover
          /p:CoverletOutput="${{ github.workspace }}/coverage/"

      - name: Sonar end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
